name: flutterproje
description: A new Flutter project.

publish_to: 'none' # Remove this line if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.4
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  fl_chart: ^0.70.2
  flutter_dotenv: ^5.0.2
  http: ^1.4.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  firebase_core: 2.32.0
  firebase_messaging: 14.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

# Uygulama ikonu: assets/icon/app_icon.png (1024x1024, kare) kaynaktan üretilir.
# Üretmek için:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#EAF8EE"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#EAF8EE"
    theme_color: "#16A34A"

flutter:
  uses-material-design: true

  assets:
    - .env

    