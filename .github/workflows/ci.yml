name: CI

# Her push ve pull request'te: kod analizi + testler + web derleme kontrolü.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Kod analizi
        run: flutter analyze

      - name: Testler
        run: flutter test

      # Web derlemesi: platforma özel kodun (dart:io vb.) web'i bozmadığını doğrular.
      - name: Web derleme kontrolü
        run: flutter build web --no-tree-shake-icons
